name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version Information ==="
          java -version
          echo "JAVA_HOME is set to: $JAVA_HOME"

          JAVA_VERSION_OUTPUT=$(java -version 2>&1 | head -n 1)
          echo "Detected version string: $JAVA_VERSION_OUTPUT"

          JAVA_MAJOR=$(echo "$JAVA_VERSION_OUTPUT" | sed -E 's/.*version "([0-9]+).*/\1/')

          if [ -z "$JAVA_MAJOR" ] || ! [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Unable to detect Java major version from '$JAVA_VERSION_OUTPUT'"
            exit 1
          fi

          echo "Active Java major version: $JAVA_MAJOR"

          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Active Java major version ($JAVA_MAJOR) is lower than 17. Java 17 or newer is required."
            exit 1
          fi

          echo "Java environment verification passed (Java $JAVA_MAJOR >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists in repository root. Skipping creation."
          else
            echo "debug.keystore not found. Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000

            if [ ! -f "./debug.keystore" ]; then
              echo "ERROR: Failed to create ./debug.keystore!"
              exit 1
            fi
            echo "Temporary debug keystore created successfully."
          fi

      - name: Build the debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$TARGET_APK" ]; then
            echo "ERROR: Expected debug APK at '$TARGET_APK' not found!"
            echo "Searching only inside app/build/outputs/apk for available APK files..."
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$TARGET_APK" ]; then
            echo "ERROR: APK at '$TARGET_APK' exists but is empty!"
            exit 1
          fi

          case "$TARGET_APK" in
            *.apk) ;;
            *)
              echo "ERROR: File '$TARGET_APK' does not have a .apk extension!"
              exit 1
              ;;
          esac

          if [ "$TARGET_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: APK path is not exactly app/build/outputs/apk/debug/app-debug.apk!"
            exit 1
          fi

          echo "APK verified successfully: $TARGET_APK (Size: $(stat -c%s "$TARGET_APK") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          ASSET_DIR="${RUNNER_TEMP}/apk-release-asset"
          mkdir -p "$ASSET_DIR"

          RAW_REPO_NAME="${{ github.event.repository.name }}"
          if [ -z "$RAW_REPO_NAME" ]; then
            RAW_REPO_NAME=$(basename "${{ github.repository }}")
          fi

          # Sanitize repository name: lowercase, replace invalid characters with hyphen, trim leading/trailing hyphens
          CLEAN_REPO_NAME=$(echo "$RAW_REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g' | sed -E 's/^-+|-+$//g')
          if [ -z "$CLEAN_REPO_NAME" ]; then
            CLEAN_REPO_NAME="android-app"
          fi

          RUN_NUMBER="${{ github.run_number }}"
          RELEASE_ASSET_NAME="${CLEAN_REPO_NAME}-debug-build-${RUN_NUMBER}.apk"
          TARGET_ASSET_PATH="${ASSET_DIR}/${RELEASE_ASSET_NAME}"

          cp "app/build/outputs/apk/debug/app-debug.apk" "$TARGET_ASSET_PATH"

          if [ ! -f "$TARGET_ASSET_PATH" ] || [ ! -s "$TARGET_ASSET_PATH" ]; then
            echo "ERROR: Failed to prepare APK release asset at '$TARGET_ASSET_PATH'"
            exit 1
          fi

          echo "Prepared release asset: $TARGET_ASSET_PATH"
          echo "asset_path=${TARGET_ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${RELEASE_ASSET_NAME}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking GitHub CLI availability..."
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Release asset '$ASSET_PATH' does not exist or is empty. Cannot publish release."
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "ERROR: Release asset '$ASSET_PATH' is not a .apk file!"
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          NOTES_FILE="${RUNNER_TEMP}/release_notes.md"
          cat << 'EOF' > "$NOTES_FILE"
          This is an automatically generated debug APK.
          The APK was built by GitHub Actions.

          - **GitHub Actions Run Number:** ${{ github.run_number }}
          - **GitHub Actions Run Attempt:** ${{ github.run_attempt }}
          - **Source Commit SHA:** ${{ github.sha }}
          - **Notice:** This APK is intended for testing.
          - **Notice:** The APK is not a Play Store production release.
          - **Signing:** The APK is signed only with a temporary debug keystore.
          EOF

          echo "Creating GitHub Release with tag: $RELEASE_TAG and asset: $ASSET_NAME"
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes-file "$NOTES_FILE" \
            --target "${{ github.sha }}" \
            --latest

          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "================================================="
            echo "GitHub Release published successfully!"
            echo "================================================="

            RELEASE_INFO=$(gh release view "$RELEASE_TAG" --json tagName,name,url 2>/dev/null || true)
            RELEASE_URL=$(echo "$RELEASE_INFO" | grep -o '"url":"[^"]*' | cut -d'"' -f4 || echo "${{ github.server_url }}/${{ github.repository }}/releases/tag/${RELEASE_TAG}")

            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release Page URL: $RELEASE_URL"
            echo "APK Asset Name: $RELEASE_ASSET_NAME"
            echo "================================================="

            {
              echo "### 🚀 Debug APK Build & Release Succeeded"
              echo ""
              echo "- **Release Tag:** \`$RELEASE_TAG\`"
              echo "- **Release Title:** Debug APK Build #${{ github.run_number }}"
              echo "- **Direct Download Link:** [Visit GitHub Release ($RELEASE_TAG)]($RELEASE_URL)"
              echo "- **Asset Filename:** \`$RELEASE_ASSET_NAME\`"
              echo ""
              echo "📱 **How to download to your phone:**"
              echo "Open the [GitHub Release page]($RELEASE_URL), scroll to the **Assets** section, and tap on \`$RELEASE_ASSET_NAME\` to download and install the debug APK directly."
              echo ""
              echo "📦 **Backup Download:**"
              echo "The standard GitHub Actions artifact named \`app-debug-apk\` is also available on this workflow summary page."
            } >> "$GITHUB_STEP_SUMMARY"

          else
            echo "::warning::GitHub Release publishing did not succeed (outcome: $RELEASE_OUTCOME)."
            echo "The debug APK build succeeded and is safely preserved as a GitHub Actions artifact."
            echo "Actions artifact name: app-debug-apk"

            {
              echo "### ⚠️ Debug APK Build Succeeded (Release Publishing Failed)"
              echo ""
              echo "The debug APK was built successfully, but automatic GitHub Release publishing could not complete (outcome: \`$RELEASE_OUTCOME\`)."
              echo ""
              echo "📦 **Download your APK:**"
              echo "The completed debug APK is preserved as a standard GitHub Actions artifact named **\`app-debug-apk\`**."
              echo "You can download it directly from the **Artifacts** section at the bottom of this workflow run page."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
